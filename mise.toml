[tools]
"cargo:vitaly" = "0.1.32"
jq = "1.8.1"
lefthook = "2.1.10"

[hooks]
postinstall = "lefthook install"

[tasks.apply]
description = "キーマップをキーボードに適用する"
usage = 'arg "<file>" default="keymaps/main.vil"'
run = 'scripts/apply.sh "$usage_file"'

[tasks.save]
description = "キーボードの現在のキーマップをファイルに保存する"
usage = 'arg "<file>" default="keymaps/main.vil"'
run = 'vitaly save -f "$usage_file"'

[tasks.format]
description = "キーマップ(.vil)を jq で整形する"
run = "scripts/format-vil.sh keymaps/*.vil"

[tasks.devices]
description = "接続中の Vial 対応デバイスを一覧する"
run = "vitaly devices"
